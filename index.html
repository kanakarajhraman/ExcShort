<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Excess and Shortage — Code 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --pasture: #eef3e4;
  --pasture-deep: #dbe6c8;
  --fence: #a98f6b;
  --fence-dark: #7c684c;
  --paper: #fdfbf4;
  --ink: #2b2f26;
  --ink-soft: #5c6353;
  --tick-green: #2f7d4f;
  --tick-green-soft: #e2efe6;
  --cross-red: #c0392b;
  --cross-red-soft: #f9e5e2;
  --amber: #c98a2c;
  --amber-light: #ffedc2; 
  --amber-locked: #ffe08a; 
  --line: #e2ddcd;
  --radius: 12px;
  --font-display: 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--pasture); color: var(--ink); font-family: var(--font-body); font-size: 24px; line-height: 1.4; }

.page { max-width: 1300px; margin: 0 auto; padding: 10px 14px 60px; }

.site-header { text-align: center; padding-bottom: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 48px; margin: 0; color: var(--fence-dark); line-height: 1; }

.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
.tab-btn { 
    font-family: var(--font-display); font-size: 22px; padding: 8px 24px; 
    border-radius: var(--radius) var(--radius) 0 0; border: 2px solid var(--line); 
    border-bottom: none; background: var(--pasture-deep); cursor: pointer; color: var(--ink-soft);
}
.tab-btn.active { background: var(--paper); color: var(--ink); font-weight: 700; border-color: var(--amber); }

.admin-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
.problem-card { border-left: 10px solid var(--amber); }
.problem-text { margin: 0; font-size: 26px; }

.demo-toggle-wrap { 
    display: inline-flex; align-items: center; gap: 10px; background: var(--paper); 
    padding: 8px 16px; border-radius: 12px; border: 2px solid var(--line); 
    font-size: 18px; font-weight: 700; cursor: pointer;
}
.demo-toggle-wrap input { width: 22px; height: 22px; cursor: pointer; }

.controls-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.input-group { display: flex; align-items: center; gap: 10px; }
.num-input { 
    font-family: var(--font-mono); font-size: 28px; width: 100px; text-align: center; 
    border: 2px solid var(--line); border-radius: 8px; padding: 5px;
}

.table-scroll { overflow-x: auto; border-radius: var(--radius); border: 2px solid var(--line); margin-bottom: 20px; }
.esa-table { width: 100%; border-collapse: collapse; background: var(--paper); table-layout: fixed; }
.esa-table th, .esa-table td { border: 1.5px solid var(--line); padding: 12px 10px; text-align: center; vertical-align: middle; }

.esa-table th { background: #efe9d8; font-size: 32px; color: var(--ink-soft); font-family: var(--font-display); line-height: 1.2; }
.esa-table .merged-header { background: var(--amber-locked); color: var(--ink); font-weight: 700; border-bottom: 3px solid var(--amber); }

.header-extra { color: var(--tick-green) !important; background: var(--tick-green-soft) !important; }
.header-short { color: var(--cross-red) !important; background: var(--cross-red-soft) !important; }
.header-subtext { display: block; font-size: 24px; font-family: var(--font-mono); font-weight: 600; margin-top: 4px; }

.esa-table td { font-family: var(--font-mono); font-size: 32px; }

.col-noun { width: 220px; }
.col-calc { width: auto; }
.col-diff { width: 180px; }

.esa-table tr.solved { background: var(--tick-green-soft); outline: 4px solid var(--tick-green); position: relative; z-index: 1; }

.cell-op-wrap { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.cell-op { font-size: 28px; color: var(--ink-soft); font-family: var(--font-mono); font-weight: 500; }
.op-extra { color: var(--tick-green); font-weight: 600; }
.op-short { color: var(--cross-red); font-weight: 600; }

.cell-input { 
    font-family: var(--font-mono); font-size: 32px; width: 110px; text-align: center; 
    border: 2px solid var(--line); border-radius: 8px; padding: 5px; 
}
.cell-input:disabled { background: var(--tick-green-soft); border-color: var(--tick-green); color: var(--ink); opacity: 1; -webkit-text-fill-color: var(--ink); }

.btn { 
    font-family: var(--font-body); font-weight: 700; font-size: 20px; padding: 10px 20px; 
    border-radius: 12px; border: none; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
}
.btn-primary { background: var(--fence-dark); color: #fff; }
.btn-ghost { background: #fff; border: 2px solid var(--line); color: var(--ink-soft); }
.btn-toggle { background: var(--paper); border: 3px solid var(--line); }
.btn-toggle.active { background: var(--amber); color: white; border-color: var(--amber); }
.btn-check { font-size: 16px; margin-left: 5px; padding: 5px 10px; }
.btn-danger { color: var(--cross-red); border: 2px solid var(--cross-red); background: #fff; }

/* Scaffold Styling v12 */
.scaffold-panel { background: #fff; border: 4px solid var(--amber); border-radius: var(--radius); padding: 40px; margin-bottom: 20px; animation: fadeIn 0.4s ease; }
.visual-area { height: 350px; position: relative; border-bottom: 4px dotted var(--fence-dark); margin-bottom: 60px; display: flex; justify-content: center; align-items: flex-end; gap: 150px; }

.visual-line-label { 
    position: absolute; width: fit-content; right: -180px; 
    top: 100%; transform: translateY(-50%);
    font-size: 36px; font-weight: 700; color: var(--fence-dark); font-family: var(--font-display);
    white-space: nowrap; pointer-events: none;
}

.bar-col { display: flex; flex-direction: column; align-items: center; width: 150px; position: relative; }
.bar { width: 150px; border-radius: 4px; position: relative; transition: height 0.15s ease, background 0.15s ease; }
.fixed-header-label { 
    position: absolute; width: 300px; text-align: center; left: 50%; transform: translateX(-50%); 
    top: -120px; font-weight: 700; font-size: 36px; color: var(--ink-soft); font-family: var(--font-display); 
    text-transform: uppercase;
}
.dynamic-counter-label { 
    position: absolute; width: 200px; text-align: center; left: 50%; transform: translateX(-50%); 
    bottom: -60px; font-weight: 700; font-size: 32px; font-family: var(--font-mono); color: var(--amber);
}
.bar.up { border-bottom: none; border-radius: 4px 4px 0 0; }
.bar.down { border-top: none; border-radius: 0 0 4px 4px; }
.bar.green { background: var(--tick-green); }
.bar.red { background: var(--cross-red); }

.gap-readout { text-align: center; font-size: 40px; font-weight: 700; margin-bottom: 30px; font-family: var(--font-mono); color: var(--amber); }

.scaffold-step-row { margin-bottom: 35px; display: flex; align-items: center; gap: 15px; opacity: 0; transform: translateY(10px); animation: stepIn 0.5s forwards; }
@keyframes stepIn { to { opacity: 1; transform: translateY(0); } }

.scaffold-label-inline { font-weight: 700; font-size: 24px; min-width: 250px; text-transform: uppercase; font-family: var(--font-display); }
.eq-group { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 32px; flex-wrap: wrap; }
.eq-input { width: 90px; height: 50px; font-size: 28px; text-align: center; border: 2px solid var(--line); border-radius: 8px; font-family: var(--font-mono); }
.eq-select { height: 50px; font-size: 28px; border: 2px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; padding: 0 5px; font-family: var(--font-mono); }
.eq-input:disabled, .eq-select:disabled { background: var(--tick-green-soft); border-color: var(--tick-green); color: var(--ink); opacity: 1; }

.or-divider { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 40px; color: var(--amber); margin: 30px 0; border-top: 2px solid var(--line); padding-top: 20px; }
.final-eq-row { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; font-family: var(--font-mono); font-size: 24px; }

.feedback-panel { margin-top: 10px; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--cross-red); }
.feedback-panel.bad { background: var(--cross-red-soft); color: var(--cross-red); }

.celebrate { margin-top: 30px; padding: 30px; text-align: center; border: 5px solid var(--tick-green); background: white; border-radius: var(--radius); }

.hidden { display: none !important; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 800px) {
  body { font-size: 18px; }
  .visual-area { gap: 40px; }
  .bar { width: 100px; }
  .scaffold-label-inline { min-width: auto; }
}
</style>
</head>
<body>

<div class="page">
    <header class="site-header">
        <h1 class="brand">Excess and Shortage</h1>
    </header>

    <div class="tabs" id="tabBar"></div>

    <div class="admin-row">
        <label class="demo-toggle-wrap">
            <input type="checkbox" id="demoToggle"> Teacher Mode
        </label>
        <button class="btn btn-toggle hidden" id="scaffoldBtn">Big & Small Difference</button>
        <button class="btn btn-ghost btn-danger" id="resetBtn">Reset Problem</button>
    </div>

    <section class="card problem-card">
        <p class="problem-text" id="questionText"></p>
    </section>

    <section id="tableControls" class="controls-row">
        <div class="input-group">
            <span id="groupNounLabel">Number of friends</span>
            <input type="number" id="groupCountInput" class="num-input" inputmode="numeric" min="1">
            <button class="btn btn-primary" id="submitCountBtn">Submit</button>
        </div>
        <button class="btn btn-ghost" id="addOneBtn">+ Add +1 Friend</button>
    </section>

    <div class="table-scroll">
        <table class="esa-table">
            <colgroup>
                <col class="col-noun">
                <col class="col-calc">
                <col class="col-calc">
                <col class="col-diff" id="colDiffStyle">
            </colgroup>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- SCAFFOLD AREA (Alternative Method) -->
    <section id="scaffoldArea" class="scaffold-panel hidden">
        <div class="gap-readout" id="gapReadout">GAP: --</div>
        <div class="visual-area">
            <div class="visual-line-label">JUST ENOUGH</div>
            <div class="bar-col">
                <div class="fixed-header-label" id="bar1FixedLabel"></div>
                <div class="bar" id="bar1"></div>
                <div class="dynamic-counter-label" id="bar1Counter"></div>
            </div>
            <div class="bar-col">
                <div class="fixed-header-label" id="bar2FixedLabel"></div>
                <div class="bar" id="bar2"></div>
                <div class="dynamic-counter-label" id="bar2Counter"></div>
            </div>
        </div>
        <div class="controls-row" id="barControls">
            <button class="btn btn-ghost" id="removeBarBtn">Remove Item</button>
            <button class="btn btn-ghost" id="addBarBtn">Add Item</button>
        </div>
        <div id="barSuccessMsg" class="scaffold-msg hidden"></div>
        <div id="scaffoldSteps"></div>
    </section>

    <!-- FINAL STEPS SECTION -->
    <section id="finalStepsArea" class="card final-steps-area hidden">
        <h3 class="brand" style="font-size:32px; margin-bottom:20px;">Final Answer Steps</h3>
        <div id="finalQuestions"></div>
        <div id="finalCelebrate" class="celebrate hidden"></div>
    </section>
</div>

<script>
(function() {
    const PROBLEMS = [
        {
            id: "a1", tabLabel: "A1", storageKey: "esa_a1_v16", personName: "Edric", itemName: "sweets", groupNoun: "friends", groupNounSingular: "Friend",
            questionText: "<strong>Edric</strong> has some sweets to give to <strong>his friends</strong>. If he gives each friend <strong>3 sweets</strong>, he has <strong>23 sweets left</strong>. If he gives each friend <strong>7 sweets</strong>, he has <strong>3 sweets left</strong>. How many sweets does Edric have?",
            lowRate: 3, lowLeftover: 23, highRate: 7, highRemainder: 3, highType: "extra",
            answerGroups: 5, answerTotal: 38, bigDifference: 20, smallDifference: 4
        },
        {
            id: "a2", tabLabel: "A2", storageKey: "esa_a2_v16", personName: "Celeste", itemName: "marbles", groupNoun: "cousins", groupNounSingular: "Cousin",
            questionText: "<strong>Celeste</strong> has some marbles to share among her <strong>cousins</strong>. If she gives each cousin <strong>4 marbles</strong>, she has <strong>29 marbles left</strong>. If she gives each cousin <strong>10 marbles</strong>, she has <strong>5 marbles left</strong>. How many marbles does Celeste have?",
            lowRate: 4, lowLeftover: 29, highRate: 10, highRemainder: 5, highType: "extra",
            answerGroups: 4, answerTotal: 45, bigDifference: 24, smallDifference: 6
        },
        {
            id: "b1", tabLabel: "B1", storageKey: "esa_b1_v16", personName: "Edric", itemName: "sweets", groupNoun: "friends", groupNounSingular: "Friend",
            questionText: "<strong>Edric</strong> has some sweets to give to <strong>his friends</strong>. If he gives each friend <strong>3 sweets</strong>, he has <strong>23 sweets left</strong>. If he gives each friend <strong>7 sweets</strong>, he is <strong>short of 5 sweets</strong>. How many sweets does Edric have?",
            lowRate: 3, lowLeftover: 23, highRate: 7, highRemainder: 5, highType: "short",
            answerGroups: 7, answerTotal: 44, bigDifference: 28, smallDifference: 4
        },
        {
            id: "b2", tabLabel: "B2", storageKey: "esa_b2_v16", personName: "Celeste", itemName: "marbles", groupNoun: "cousins", groupNounSingular: "Cousin",
            questionText: "<strong>Celeste</strong> has some marbles to share among her <strong>cousins</strong>. If she gives each cousin <strong>4 marbles</strong>, she has <strong>29 marbles left</strong>. If she gives each cousin <strong>10 marbles</strong>, she is <strong>short of 7 marbles</strong>. How many marbles does Celeste have?",
            lowRate: 4, lowLeftover: 29, highRate: 10, highRemainder: 7, highType: "short",
            answerGroups: 6, answerTotal: 53, bigDifference: 36, smallDifference: 6
        }
    ];

    let currentProblem = PROBLEMS[0];
    let state = null;

    const el = {
        tabs: document.getElementById('tabBar'),
        question: document.getElementById('questionText'),
        groupNounLabel: document.getElementById('groupNounLabel'),
        groupInput: document.getElementById('groupCountInput'),
        submitBtn: document.getElementById('submitCountBtn'),
        addBtn: document.getElementById('addOneBtn'),
        tableHead: document.getElementById('tableHead'),
        tableBody: document.getElementById('tableBody'),
        scaffoldBtn: document.getElementById('scaffoldBtn'),
        scaffoldArea: document.getElementById('scaffoldArea'),
        scaffoldSteps: document.getElementById('scaffoldSteps'),
        demoToggle: document.getElementById('demoToggle'),
        resetBtn: document.getElementById('resetBtn'),
        colDiffStyle: document.getElementById('colDiffStyle'),
        gapReadout: document.getElementById('gapReadout'),
        bar1: document.getElementById('bar1'),
        bar2: document.getElementById('bar2'),
        bar1Fixed: document.getElementById('bar1FixedLabel'),
        bar2Fixed: document.getElementById('bar2FixedLabel'),
        bar1Counter: document.getElementById('bar1Counter'),
        bar2Counter: document.getElementById('bar2Counter'),
        addBar: document.getElementById('addBarBtn'),
        removeBar: document.getElementById('removeBarBtn'),
        barSuccess: document.getElementById('barSuccessMsg'),
        finalArea: document.getElementById('finalStepsArea'),
        finalQuestions: document.getElementById('finalQuestions'),
        finalCelebrate: document.getElementById('finalCelebrate'),
        tableControls: document.getElementById('tableControls')
    };

    function init() {
        loadProblem(PROBLEMS[0]);
        el.submitBtn.onclick = () => addRow(parseInt(el.groupInput.value));
        el.addBtn.onclick = () => {
            const max = state.rows.length ? Math.max(...state.rows.map(r => r.n)) : 0;
            addRow(max + 1);
        };
        el.demoToggle.onchange = (e) => { state.demoMode = e.target.checked; save(); renderAll(); };
        el.scaffoldBtn.onclick = toggleScaffold;
        el.resetBtn.onclick = resetProblem;
        el.addBar.onclick = () => moveBars(1);
        el.removeBar.onclick = () => moveBars(-1);
    }

    function loadProblem(p) {
        currentProblem = p;
        const saved = localStorage.getItem(p.storageKey);
        state = saved ? JSON.parse(saved) : getDefaultState();
        el.demoToggle.checked = state.demoMode;
        renderAll();
    }

    function getDefaultState() {
        return { 
            rows: [{ n: 1, v1: null, v2: null }], 
            scaffoldActive: false, scaffoldStep: 0, barOffset: 0, barDone: false,
            attempts: {}, demoMode: false, stepsDone: {}, finalAnswersDone: {}
        };
    }

    function save() { localStorage.setItem(currentProblem.storageKey, JSON.stringify(state)); }

    function renderTabs() {
        el.tabs.innerHTML = "";
        PROBLEMS.forEach(p => {
            const b = document.createElement('button');
            b.className = "tab-btn" + (p === currentProblem ? " active" : "");
            b.innerText = p.tabLabel;
            b.onclick = () => loadProblem(p);
            el.tabs.appendChild(b);
        });
    }

    function renderAll() {
        renderTabs();
        el.question.innerHTML = currentProblem.questionText;
        el.groupNounLabel.innerText = `Number of ${currentProblem.groupNoun}`;
        el.addBtn.innerText = `+ Add +1 ${currentProblem.groupNounSingular}`;
        
        const solved = checkSolvedLogic();
        el.tableControls.classList.toggle('hidden', solved && !state.demoMode);

        const highColorClass = currentProblem.highType === 'extra' ? 'header-extra' : 'header-short';
        const showDiffCol = state.scaffoldActive && state.scaffoldStep >= 2;

        el.tableHead.innerHTML = `
            <tr>
                <th rowspan="2" class="col-noun">Number of<br>${currentProblem.groupNoun}</th>
                <th colspan="2" class="merged-header">Total Number of ${currentProblem.itemName.charAt(0).toUpperCase() + currentProblem.itemName.slice(1)}</th>
                ${showDiffCol ? '<th rowspan="2" class="col-diff">Difference</th>' : ''}
            </tr>
            <tr>
                <th class="header-extra">${currentProblem.lowRate} each <span class="header-subtext">+${currentProblem.lowLeftover} extra</span></th>
                <th class="${highColorClass}">${currentProblem.highRate} each <span class="header-subtext">${currentProblem.highType === 'extra' ? '+' : '-'}${currentProblem.highRemainder} ${currentProblem.highType}</span></th>
            </tr>
        `;

        el.colDiffStyle.classList.toggle('hidden', !showDiffCol);
        const max = state.rows.length ? Math.max(...state.rows.map(r => r.n)) : 1;
        el.groupInput.value = max;

        renderTable(showDiffCol);
        updateScaffoldVisibility();
        renderScaffold();
        renderFinalSteps();
    }

    function addRow(n) {
        if (isNaN(n) || n < 1) return;
        if (state.rows.some(r => r.n === n)) return;
        state.rows.push({ n, v1: null, v2: null });
        el.groupInput.value = n;
        save(); renderTable(state.scaffoldActive && state.scaffoldStep >= 2);
    }

    function renderTable(showDiff) {
        el.tableBody.innerHTML = "";
        const sortedRows = state.scaffoldActive ? [...state.rows].sort((a,b) => a.n - b.n) : state.rows;
        sortedRows.forEach(row => {
            const tr = document.createElement('tr');
            const t1 = row.n * currentProblem.lowRate + currentProblem.lowLeftover;
            const t2 = currentProblem.highType === 'extra' ? (row.n * currentProblem.highRate + currentProblem.highRemainder) : (row.n * currentProblem.highRate - currentProblem.highRemainder);
            if (state.demoMode || (row.v1 === t1 && row.v2 === t2)) if (t1 === t2) tr.className = "solved";
            tr.innerHTML = `<td style="font-weight:700;">${row.n}</td>`;
            tr.appendChild(renderCell(row, 1, t1, `${row.n} × ${currentProblem.lowRate}`, `+ ${currentProblem.lowLeftover}`, 'extra'));
            tr.appendChild(renderCell(row, 2, t2, `${row.n} × ${currentProblem.highRate}`, `${currentProblem.highType === 'extra' ? '+' : '-'} ${currentProblem.highRemainder}`, currentProblem.highType));
            if (showDiff) {
                const diffVal = Math.abs(t1 - t2);
                tr.innerHTML += `<td><div class="cell-input" style="background:var(--amber-light); border-color:var(--amber); width:100%; margin:0 auto;">${diffVal}</div></td>`;
            }
            el.tableBody.appendChild(tr);
        });
    }

    function renderCell(row, idx, target, baseOp, modOp, type) {
        const td = document.createElement('td');
        const key = `r${row.n}_v${idx}`;
        const isDone = state.demoMode || row[`v${idx}`] === target;
        const modClass = type === 'extra' ? 'op-extra' : 'op-short';
        const wrap = document.createElement('div');
        wrap.className = "cell-op-wrap";
        wrap.innerHTML = `<span class="cell-op">${baseOp} <span class="${modClass}">${modOp}</span> = </span>`;
        if (isDone) {
            wrap.innerHTML += `<div class="cell-input" style="background:var(--tick-green-soft); border-color:var(--tick-green); width:110px;">${target}</div>`;
        } else {
            const inp = document.createElement('input'); inp.className = "cell-input"; inp.type = "number"; inp.inputmode = "numeric";
            const btn = document.createElement('button'); btn.className = "btn btn-primary btn-check"; btn.innerText = "Check";
            btn.onclick = () => { if (parseInt(inp.value) === target) { row[`v${idx}`] = target; save(); renderAll(); processProgression(row); } else showFeedback("Incorrect total.", key, inp); };
            wrap.appendChild(inp); wrap.appendChild(btn);
        }
        td.appendChild(wrap); return td;
    }

    function processProgression(row) {
        const t1 = row.n * currentProblem.lowRate + currentProblem.lowLeftover;
        const t2 = currentProblem.highType === 'extra' ? (row.n * currentProblem.highRate + currentProblem.highRemainder) : (row.n * currentProblem.highRate - currentProblem.highRemainder);
        if ((state.demoMode || (row.v1 === t1 && row.v2 === t2))) {
            if (t1 === t2) renderAll();
            else if (!state.demoMode) {
                const lastRow = state.rows[state.rows.length - 1];
                if (row.n === lastRow.n) { addRow(row.n + 1); renderAll(); }
            }
        }
    }

    function checkSolvedLogic() {
        return state.rows.some(r => {
            const t1 = r.n * currentProblem.lowRate + currentProblem.lowLeftover;
            const t2 = currentProblem.highType === 'extra' ? (r.n * currentProblem.highRate + currentProblem.highRemainder) : (r.n * currentProblem.highRate - currentProblem.highRemainder);
            return (state.demoMode || (r.v1 === t1 && r.v2 === t2)) && (t1 === t2);
        });
    }

    function updateScaffoldVisibility() {
        const solved = checkSolvedLogic();
        el.scaffoldBtn.classList.toggle('hidden', !(state.demoMode || solved));
        el.scaffoldBtn.classList.toggle('active', state.scaffoldActive);
    }

    function toggleScaffold() {
        state.scaffoldActive = !state.scaffoldActive;
        if (state.scaffoldActive) {
            for (let i = 1; i <= currentProblem.answerGroups; i++) if (!state.rows.some(r => r.n === i)) addRow(i);
        }
        save(); renderAll();
    }

    function renderScaffold() {
        el.scaffoldArea.classList.toggle('hidden', !state.scaffoldActive);
        if (!state.scaffoldActive) return;

        const b1Base = currentProblem.lowLeftover;
        const b2Base = currentProblem.highType === 'extra' ? currentProblem.highRemainder : -currentProblem.highRemainder;
        const cur1 = b1Base + state.barOffset;
        const cur2 = b2Base + state.barOffset;
        
        el.bar1Fixed.innerText = `${currentProblem.lowLeftover} EXTRA`;
        el.bar2Fixed.innerText = `${currentProblem.highRemainder} ${currentProblem.highType.toUpperCase()}`;
        
        updateBar(el.bar1, cur1, 5, el.bar1Counter);
        updateBar(el.bar2, cur2, 5, el.bar2Counter);
        el.gapReadout.innerText = `GAP: ${Math.abs(cur1 - cur2)}`;

        if (cur2 === 0 && !state.barDone) {
            state.barDone = true; state.scaffoldStep = 1;
            el.barSuccess.innerHTML = `THE ${currentProblem.highRate} EACH BAR IS NOW AT ZERO.`;
            el.barSuccess.classList.remove('hidden');
            document.getElementById('barControls').classList.add('hidden');
            save(); renderAll();
        } else if (state.barDone) {
            el.barSuccess.classList.remove('hidden');
            document.getElementById('barControls').classList.add('hidden');
        }
        renderScaffoldSteps();
    }

    function updateBar(barEl, val, scale, counterEl) {
        const h = Math.abs(val) * scale; barEl.style.height = h + 'px';
        barEl.className = `bar ${val >= 0 ? 'up green' : 'down red'}`;
        counterEl.innerText = `${Math.abs(val)} ${val >= 0 ? 'EXTRA' : 'SHORT'}`;
    }

    function renderScaffoldSteps() {
        el.scaffoldSteps.innerHTML = "";
        if (state.scaffoldStep >= 1) renderBigDiffStep();
        if (state.scaffoldStep >= 2) renderSmallDiffStep();
        if (state.scaffoldStep >= 3) renderDivisionStep();
        if (state.scaffoldStep >= 4) renderFinalTotalAlternative();
    }

    function renderBigDiffStep() {
        const op = currentProblem.highType === 'extra' ? '-' : '+';
        el.scaffoldSteps.appendChild(createEqRow("step1", `Big Difference :`, [currentProblem.lowLeftover, op, currentProblem.highRemainder, currentProblem.bigDifference], 1));
    }

    function renderSmallDiffStep() {
        el.scaffoldSteps.appendChild(createEqRow("step2", `Small Difference :`, [currentProblem.highRate, '-', currentProblem.lowRate, currentProblem.smallDifference], 2));
    }

    function renderDivisionStep() {
        el.scaffoldSteps.appendChild(createEqRow("step3", `How many ${currentProblem.groupNoun} are there?`, [currentProblem.bigDifference, '÷', currentProblem.smallDifference, currentProblem.answerGroups], 3));
    }

    function renderFinalTotalAlternative() {
        const div = document.createElement('div'); div.className = "scaffold-step-row"; div.style.flexDirection = "column"; div.style.alignItems = "flex-start";
        div.innerHTML = `<label class="scaffold-label-inline" style="margin-bottom:20px;">How many ${currentProblem.itemName} are there?</label>`;
        
        div.appendChild(createEqRow("step4a1", `Given to ${currentProblem.groupNoun} :`, [currentProblem.answerGroups, '×', currentProblem.lowRate, currentProblem.answerGroups * currentProblem.lowRate], 4, true));
        div.appendChild(createEqRow("step4a2", `Total ${currentProblem.itemName} (including Extra / removing Shortage) :`, [currentProblem.answerGroups * currentProblem.lowRate, '+', currentProblem.lowLeftover, currentProblem.answerTotal], 4, true));

        div.innerHTML += `<div class="or-divider">OR</div>`;

        const hOp = currentProblem.highType === 'extra' ? '+' : '-';
        div.appendChild(createEqRow("step4b1", `Given to ${currentProblem.groupNoun} :`, [currentProblem.answerGroups, '×', currentProblem.highRate, currentProblem.answerGroups * currentProblem.highRate], 4, true));
        div.appendChild(createEqRow("step4b2", `Total ${currentProblem.itemName} (including Extra / removing Shortage) :`, [currentProblem.answerGroups * currentProblem.highRate, hOp, currentProblem.highRemainder, currentProblem.answerTotal], 4, true));

        if (state.stepsDone['step4b2']) {
             const cel = document.createElement('div'); cel.className = "celebrate";
             cel.innerHTML = `<h2>Correct!</h2><p>${currentProblem.personName} has ${currentProblem.answerTotal} ${currentProblem.itemName}.</p>`;
             div.appendChild(cel);
        }
        el.scaffoldSteps.appendChild(div);
    }

    function createEqRow(id, label, expected, stepIdx, subRow = false) {
        const container = document.createElement('div'); container.className = subRow ? "final-eq-row" : "scaffold-step-row";
        container.innerHTML = `<span class="scaffold-label-inline">${label}</span>`;
        const group = document.createElement('div'); group.className = "eq-group";
        const isDone = state.stepsDone[id];

        const v1 = createEqInput(isDone); const op = createEqSelect(isDone); const v2 = createEqInput(isDone); const res = createEqInput(isDone);
        group.appendChild(v1); group.appendChild(op); group.appendChild(v2); group.appendChild(document.createTextNode(" = ")); group.appendChild(res);

        if (!isDone) {
            const btn = document.createElement('button'); btn.className = "btn btn-primary btn-check"; btn.innerText = "Check";
            btn.onclick = () => {
                if (v1.value == expected[0] && op.value == expected[1] && v2.value == expected[2] && res.value == expected[3]) {
                    state.stepsDone[id] = true; if (!subRow) state.scaffoldStep = stepIdx + 1; save(); renderAll();
                } else showFeedback("Incorrect values.", id);
            };
            group.appendChild(btn);
        } else {
            v1.value = expected[0]; op.value = expected[1]; v2.value = expected[2]; res.value = expected[3];
            v1.disabled = op.disabled = v2.disabled = res.disabled = true; group.appendChild(document.createTextNode(" ✓"));
        }
        container.appendChild(group); return container;
    }

    function createEqInput(disabled) {
        const inp = document.createElement('input'); inp.type = "number"; inp.inputmode = "numeric"; inp.className = "eq-input";
        if (disabled) inp.disabled = true; return inp;
    }

    function createEqSelect(disabled) {
        const sel = document.createElement('select'); sel.className = "eq-select";
        ['+', '-', '×', '÷'].forEach(o => { const opt = document.createElement('option'); opt.value = o; opt.innerText = o; sel.appendChild(opt); });
        if (disabled) sel.disabled = true; return sel;
    }

    function moveBars(dir) { state.barOffset += dir; save(); renderScaffold(); }

    function renderFinalSteps() {
        const isSolved = checkSolvedLogic();
        if (!isSolved || state.scaffoldActive) { el.finalArea.classList.add('hidden'); return; }
        el.finalArea.classList.remove('hidden'); el.finalQuestions.innerHTML = "";
        
        const q1 = createFinalQ("groups", `How many ${currentProblem.groupNoun} does ${currentProblem.personName} have?`, currentProblem.answerGroups);
        el.finalQuestions.appendChild(q1);

        if (state.finalAnswersDone['groups']) {
            const q2 = document.createElement('div'); q2.className = "final-step-row";
            q2.innerHTML = `<label class="final-label">How many ${currentProblem.itemName} does ${currentProblem.personName} have?</label>`;
            q2.appendChild(createFinalEq("total1", `${currentProblem.lowRate} each: ${currentProblem.answerGroups} × ${currentProblem.lowRate} + ${currentProblem.lowLeftover} = `, currentProblem.answerTotal));
            const opH = currentProblem.highType === 'extra' ? '+' : '-';
            q2.appendChild(createFinalEq("total2", `${currentProblem.highRate} each: ${currentProblem.answerGroups} × ${currentProblem.highRate} ${opH} ${currentProblem.highRemainder} = `, currentProblem.answerTotal));
            el.finalQuestions.appendChild(q2);
        }

        if (state.finalAnswersDone['total1'] && state.finalAnswersDone['total2']) {
            el.finalCelebrate.innerHTML = `<h2 class="brand" style="font-size:40px;">Correct!</h2><p style="font-size:32px; font-weight:700;">${currentProblem.personName} has ${currentProblem.answerTotal} ${currentProblem.itemName}.</p>`;
            el.finalCelebrate.classList.remove('hidden');
        } else el.finalCelebrate.classList.add('hidden');
    }

    function createFinalQ(id, label, target) {
        const div = document.createElement('div'); div.className = "final-step-row"; div.innerHTML = `<label class="final-label">${label}</label>`;
        const isDone = state.finalAnswersDone[id];
        const row = document.createElement('div'); row.className = "controls-row"; row.style.justifyContent = "flex-start";
        const inp = document.createElement('input'); inp.type = "number"; inp.className = "num-input";
        if (isDone) { inp.value = target; inp.disabled = true; row.appendChild(inp); row.appendChild(document.createTextNode(" ✓")); }
        else {
            const btn = document.createElement('button'); btn.className = "btn btn-primary"; btn.innerText = "Check";
            btn.onclick = () => { if (parseInt(inp.value) === target) { state.finalAnswersDone[id] = true; save(); renderAll(); } else showFeedback("Incorrect answer.", id, inp); };
            row.appendChild(inp); row.appendChild(btn);
        }
        div.appendChild(row); return div;
    }

    function createFinalEq(id, label, target) {
        const div = document.createElement('div'); div.className = "final-eq-row"; div.innerHTML = `<span>${label}</span>`;
        const isDone = state.finalAnswersDone[id];
        const inp = document.createElement('input'); inp.type = "number"; inp.className = "num-input";
        if (isDone) { inp.value = target; inp.disabled = true; div.appendChild(inp); div.appendChild(document.createTextNode(" ✓")); }
        else {
            const btn = document.createElement('button'); btn.className = "btn btn-primary btn-check"; btn.innerText = "✓";
            btn.onclick = () => { if (parseInt(inp.value) === target) { state.finalAnswersDone[id] = true; save(); renderAll(); } else showFeedback("Incorrect total.", id, inp); };
            div.appendChild(inp); div.appendChild(btn);
        }
        return div;
    }

    function showFeedback(msg, id, targetInput = null) {
        const existing = document.getElementById('fb_' + id); if (existing) existing.remove();
        const div = document.createElement('div'); div.id = 'fb_' + id; div.className = "feedback-panel bad";
        div.innerHTML = `<span>${msg}</span><button class="btn btn-ghost btn-check">Retry</button>`;
        div.querySelector('button').onclick = () => { div.remove(); if (targetInput) { targetInput.value = ""; targetInput.focus(); } };
        document.body.appendChild(div);
        const ref = (targetInput || document.activeElement); const rect = ref.getBoundingClientRect();
        div.style.position = 'fixed'; div.style.top = (rect.bottom + window.scrollY + 10) + 'px';
        div.style.left = Math.max(10, rect.left - 50) + 'px'; div.style.zIndex = 1000;
    }

    function resetProblem() {
        if (confirm("Reset all work and return to Student Mode for this problem?")) { 
            localStorage.removeItem(currentProblem.storageKey); 
            state = getDefaultState(); 
            el.demoToggle.checked = false;
            save(); 
            renderAll();
            document.querySelectorAll('.feedback-panel').forEach(p => p.remove());
        }
    }

    init();
})();
</script>
</body>
</html>

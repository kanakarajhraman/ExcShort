<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Excess and Shortage — Code 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --pasture: #eef3e4;
  --pasture-deep: #dbe6c8;
  --fence: #a98f6b;
  --fence-dark: #7c684c;
  --paper: #fdfbf4;
  --ink: #2b2f26;
  --ink-soft: #5c6353;
  --tick-green: #2f7d4f;
  --tick-green-soft: #e2efe6;
  --cross-red: #c0392b;
  --cross-red-soft: #f9e5e2;
  --amber: #c98a2c;
  --amber-light: #ffedc2; 
  --amber-locked: #ffe08a; 
  --line: #e2ddcd;
  --radius: 12px;
  --font-display: 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--pasture); color: var(--ink); font-family: var(--font-body); font-size: 24px; line-height: 1.4; }

.page { max-width: 1250px; margin: 0 auto; padding: 10px 14px 60px; }

.site-header { text-align: center; padding-bottom: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 48px; margin: 0; color: var(--fence-dark); line-height: 1; }

.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
.tab-btn { 
    font-family: var(--font-display); font-size: 22px; padding: 8px 24px; 
    border-radius: var(--radius) var(--radius) 0 0; border: 2px solid var(--line); 
    border-bottom: none; background: var(--pasture-deep); cursor: pointer; color: var(--ink-soft);
}
.tab-btn.active { background: var(--paper); color: var(--ink); font-weight: 700; border-color: var(--amber); }

.admin-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
.problem-card { border-left: 10px solid var(--amber); }
.problem-text { margin: 0; font-size: 26px; }

.demo-toggle-wrap { 
    display: inline-flex; align-items: center; gap: 10px; background: var(--paper); 
    padding: 8px 16px; border-radius: 12px; border: 2px solid var(--line); 
    font-size: 18px; font-weight: 700; cursor: pointer;
}
.demo-toggle-wrap input { width: 22px; height: 22px; cursor: pointer; }

.controls-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.input-group { display: flex; align-items: center; gap: 10px; }
.num-input { 
    font-family: var(--font-mono); font-size: 28px; width: 100px; text-align: center; 
    border: 2px solid var(--line); border-radius: 8px; padding: 5px;
}

.table-scroll { overflow-x: auto; border-radius: var(--radius); border: 2px solid var(--line); margin-bottom: 20px; }
.esa-table { width: 100%; border-collapse: collapse; background: var(--paper); table-layout: fixed; }
.esa-table th, .esa-table td { border: 1.5px solid var(--line); padding: 12px 10px; text-align: center; vertical-align: middle; }

.esa-table th { background: #efe9d8; font-size: 32px; color: var(--ink-soft); font-family: var(--font-display); line-height: 1.2; }
.esa-table .merged-header { background: var(--amber-locked); color: var(--ink); font-weight: 700; border-bottom: 3px solid var(--amber); }

.header-extra { color: var(--tick-green) !important; background: var(--tick-green-soft) !important; }
.header-short { color: var(--cross-red) !important; background: var(--cross-red-soft) !important; }
.header-subtext { display: block; font-size: 24px; font-family: var(--font-mono); font-weight: 600; margin-top: 4px; }

.esa-table td { font-family: var(--font-mono); font-size: 32px; }

.col-noun { width: 220px; }
.col-calc { width: auto; }
.col-diff { width: 180px; }

.esa-table tr.solved { background: var(--tick-green-soft); outline: 4px solid var(--tick-green); position: relative; z-index: 1; }

.cell-op-wrap { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.cell-op { font-size: 28px; color: var(--ink-soft); font-family: var(--font-mono); font-weight: 500; }
.op-extra { color: var(--tick-green); font-weight: 600; }
.op-short { color: var(--cross-red); font-weight: 600; }

.cell-input { 
    font-family: var(--font-mono); font-size: 32px; width: 110px; text-align: center; 
    border: 2px solid var(--line); border-radius: 8px; padding: 5px; 
}
.cell-input:disabled { background: var(--tick-green-soft); border-color: var(--tick-green); color: var(--ink); opacity: 1; -webkit-text-fill-color: var(--ink); }

.btn { 
    font-family: var(--font-body); font-weight: 700; font-size: 20px; padding: 10px 20px; 
    border-radius: 12px; border: none; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
}
.btn-primary { background: var(--fence-dark); color: #fff; }
.btn-ghost { background: #fff; border: 2px solid var(--line); color: var(--ink-soft); }
.btn-toggle { background: var(--paper); border: 3px solid var(--line); }
.btn-toggle.active { background: var(--amber); color: white; border-color: var(--amber); }
.btn-check { font-size: 16px; margin-left: 5px; padding: 5px 10px; }
.btn-danger { color: var(--cross-red); border: 2px solid var(--cross-red); background: #fff; }

.scaffold-panel { 
    background: #fff; border: 4px solid var(--amber); border-radius: var(--radius); 
    padding: 25px; margin-bottom: 20px; animation: fadeIn 0.4s ease;
}
.visual-area { height: 260px; position: relative; border-bottom: 2px dashed var(--fence-dark); margin-bottom: 40px; display: flex; justify-content: space-around; align-items: flex-end; }
.visual-line-label { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; color: var(--fence-dark); }
.bar-col { display: flex; flex-direction: column; align-items: center; width: 140px; transition: height 0.15s ease; }
.bar { width: 60px; border-radius: 4px; position: relative; transition: height 0.15s ease, background 0.15s ease; }
.bar-label { position: absolute; width: 150px; text-align: center; left: 50%; transform: translateX(-50%); font-weight: 700; font-size: 18px; white-space: nowrap; font-family: var(--font-mono); }
.bar.up { border-bottom: none; border-radius: 4px 4px 0 0; }
.bar.down { border-top: none; border-radius: 0 0 4px 4px; }
.bar.green { background: var(--tick-green); }
.bar.red { background: var(--cross-red); }

.gap-readout { text-align: center; font-size: 32px; font-weight: 700; margin-bottom: 20px; font-family: var(--font-mono); }
.scaffold-msg { padding: 15px; border-radius: 8px; background: var(--amber-light); margin-top: 15px; font-weight: 600; text-align: center; }

.final-steps-area { border-top: 10px solid var(--amber); margin-top: 30px; animation: fadeIn 0.5s ease; }
.final-step-row { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1.5px dashed var(--line); }
.final-label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 24px; }
.final-eq-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; font-family: var(--font-mono); font-size: 28px; }

.feedback-panel { margin-top: 10px; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--cross-red); }
.feedback-panel.bad { background: var(--cross-red-soft); color: var(--cross-red); }
.skip-link { font-size: 14px; text-decoration: underline; color: var(--ink-soft); cursor: pointer; opacity: 0.6; margin-left: 10px; font-family: var(--font-body); }

.celebrate { margin-top: 30px; padding: 30px; text-align: center; border: 5px solid var(--tick-green); background: white; border-radius: var(--radius); }

.hidden { display: none !important; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 800px) {
  body { font-size: 18px; }
  .brand { font-size: 36px; }
  .esa-table th { font-size: 20px; }
  .header-subtext { font-size: 16px; }
  .cell-op { font-size: 18px; }
  .cell-input { width: 80px; font-size: 22px; }
  .col-noun { width: 140px; }
}
</style>
</head>
<body>

<div class="page">
    <header class="site-header">
        <h1 class="brand">Excess and Shortage</h1>
    </header>

    <div class="tabs" id="tabBar"></div>

    <div class="admin-row">
        <label class="demo-toggle-wrap">
            <input type="checkbox" id="demoToggle"> Teacher Mode
        </label>
        <button class="btn btn-toggle hidden" id="scaffoldBtn">Big & Small Difference</button>
        <button class="btn btn-ghost btn-danger" id="resetBtn">Reset Problem</button>
    </div>

    <section class="card problem-card">
        <p class="problem-text" id="questionText"></p>
    </section>

    <section id="tableControls" class="controls-row">
        <div class="input-group">
            <span id="groupNounLabel">Number of friends</span>
            <input type="number" id="groupCountInput" class="num-input" inputmode="numeric" min="1">
            <button class="btn btn-primary" id="submitCountBtn">Submit</button>
        </div>
        <button class="btn btn-ghost" id="addOneBtn">+ Add +1 Friend</button>
    </section>

    <div class="table-scroll">
        <table class="esa-table">
            <colgroup>
                <col class="col-noun">
                <col class="col-calc">
                <col class="col-calc">
                <col class="col-diff" id="colDiffStyle">
            </colgroup>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <section id="scaffoldArea" class="scaffold-panel hidden">
        <div class="gap-readout" id="gapReadout">Gap: --</div>
        <div class="visual-area">
            <div class="visual-line-label">just enough</div>
            <div class="bar-col" id="bar1Col">
                <div class="bar-label" style="top: -40px;" id="bar1LabelTop"></div>
                <div class="bar" id="bar1"></div>
                <div class="bar-label" style="bottom: -40px;" id="bar1LabelBot"></div>
            </div>
            <div class="bar-col" id="bar2Col">
                <div class="bar-label" style="top: -40px;" id="bar2LabelTop"></div>
                <div class="bar" id="bar2"></div>
                <div class="bar-label" style="bottom: -40px;" id="bar2LabelBot"></div>
            </div>
        </div>
        <div class="controls-row">
            <button class="btn btn-ghost" id="removeBarBtn">Remove Item</button>
            <button class="btn btn-ghost" id="addBarBtn">Add Item</button>
            <button class="btn btn-ghost btn-danger" id="undoBarBtn">Undo</button>
        </div>
        <div id="barSuccessMsg" class="scaffold-msg hidden"></div>

        <div id="whyStep" class="hidden" style="margin-top: 40px; border-top: 2px solid var(--line); padding-top: 20px;">
            <p style="font-weight: 700; text-align: center;" id="whyPrompt"></p>
            <div class="controls-row">
                <input type="text" id="whyInput" class="num-input" style="width: 300px; text-align: left;">
                <button class="btn btn-primary" id="whyCheckBtn">Check</button>
                <span class="skip-link hidden" id="whySkipLink">Skip</span>
            </div>
            <div id="whyFeedback" class="feedback-panel hidden"></div>
        </div>
    </section>

    <!-- FINAL STEPS SECTION -->
    <section id="finalStepsArea" class="card final-steps-area hidden">
        <h3 class="brand" style="font-size:32px; margin-bottom:20px;">Final Answer Steps</h3>
        
        <div id="finalGroupsStep" class="final-step-row">
            <label class="final-label" id="finalGroupsLabel"></label>
            <div class="controls-row" style="justify-content: flex-start;">
                <input type="number" id="finalGroupsInput" class="num-input" inputmode="numeric">
                <button class="btn btn-primary" id="finalGroupsBtn">Check</button>
                <span class="skip-link hidden" id="finalGroupsSkip">Skip</span>
            </div>
        </div>

        <div id="finalTotalsStep" class="final-step-row hidden">
            <label class="final-label" id="finalTotalsLabel"></label>
            <div class="final-eq-row">
                <span id="eq1Label"></span>
                <input type="number" id="finalTotal1Input" class="num-input" inputmode="numeric">
                <button class="btn btn-primary btn-check" id="finalTotal1Btn">✓</button>
                <span class="skip-link hidden" id="finalTotal1Skip">Skip</span>
            </div>
            <div class="final-eq-row">
                <span id="eq2Label"></span>
                <input type="number" id="finalTotal2Input" class="num-input" inputmode="numeric">
                <button class="btn btn-primary btn-check" id="finalTotal2Btn">✓</button>
                <span class="skip-link hidden" id="finalTotal2Skip">Skip</span>
            </div>
        </div>

        <div id="finalCelebrate" class="celebrate hidden"></div>
    </section>
</div>

<script>
(function() {
    const PROBLEMS = [
        {
            id: "a1", tabLabel: "A1", storageKey: "esa_a1_v12", personName: "Edric", itemName: "sweets", groupNoun: "friends", groupNounSingular: "Friend",
            questionText: "<strong>Edric</strong> has some sweets to give to <strong>his friends</strong>. If he gives each friend <strong>3 sweets</strong>, he has <strong>23 sweets left</strong>. If he gives each friend <strong>7 sweets</strong>, he has <strong>3 sweets left</strong>. How many sweets does Edric have?",
            lowRate: 3, lowLeftover: 23, highRate: 7, highRemainder: 3, highType: "extra",
            answerGroups: 5, answerTotal: 38, bigDifference: 20, smallDifference: 4, whyAnswer: "7-3", slideDirection: "remove", slideSteps: 3
        },
        {
            id: "a2", tabLabel: "A2", storageKey: "esa_a2_v12", personName: "Celeste", itemName: "marbles", groupNoun: "cousins", groupNounSingular: "Cousin",
            questionText: "<strong>Celeste</strong> has some marbles to share among her <strong>cousins</strong>. If she gives each cousin <strong>4 marbles</strong>, she has <strong>29 marbles left</strong>. If she gives each cousin <strong>10 marbles</strong>, she has <strong>5 marbles left</strong>. How many marbles does Celeste have?",
            lowRate: 4, lowLeftover: 29, highRate: 10, highRemainder: 5, highType: "extra",
            answerGroups: 4, answerTotal: 45, bigDifference: 24, smallDifference: 6, whyAnswer: "10-4", slideDirection: "remove", slideSteps: 5
        },
        {
            id: "b1", tabLabel: "B1", storageKey: "esa_b1_v12", personName: "Edric", itemName: "sweets", groupNoun: "friends", groupNounSingular: "Friend",
            questionText: "<strong>Edric</strong> has some sweets to give to <strong>his friends</strong>. If he gives each friend <strong>3 sweets</strong>, he has <strong>23 sweets left</strong>. If he gives each friend <strong>7 sweets</strong>, he is <strong>short of 5 sweets</strong>. How many sweets does Edric have?",
            lowRate: 3, lowLeftover: 23, highRate: 7, highRemainder: 5, highType: "short",
            answerGroups: 7, answerTotal: 44, bigDifference: 28, smallDifference: 4, whyAnswer: "7-3", slideDirection: "add", slideSteps: 5
        },
        {
            id: "b2", tabLabel: "B2", storageKey: "esa_b2_v12", personName: "Celeste", itemName: "marbles", groupNoun: "cousins", groupNounSingular: "Cousin",
            questionText: "<strong>Celeste</strong> has some marbles to share among her <strong>cousins</strong>. If she gives each cousin <strong>4 marbles</strong>, she has <strong>29 marbles left</strong>. If she gives each cousin <strong>10 marbles</strong>, she is <strong>short of 7 marbles</strong>. How many marbles does Celeste have?",
            lowRate: 4, lowLeftover: 29, highRate: 10, highRemainder: 7, highType: "short",
            answerGroups: 6, answerTotal: 53, bigDifference: 36, smallDifference: 6, whyAnswer: "10-4", slideDirection: "add", slideSteps: 7
        }
    ];

    let currentProblem = PROBLEMS[0];
    let state = null;

    const el = {
        tabs: document.getElementById('tabBar'),
        question: document.getElementById('questionText'),
        groupNounLabel: document.getElementById('groupNounLabel'),
        groupInput: document.getElementById('groupCountInput'),
        submitBtn: document.getElementById('submitCountBtn'),
        addBtn: document.getElementById('addOneBtn'),
        tableHead: document.getElementById('tableHead'),
        tableBody: document.getElementById('tableBody'),
        scaffoldBtn: document.getElementById('scaffoldBtn'),
        scaffoldArea: document.getElementById('scaffoldArea'),
        demoToggle: document.getElementById('demoToggle'),
        resetBtn: document.getElementById('resetBtn'),
        colDiffStyle: document.getElementById('colDiffStyle'),
        gapReadout: document.getElementById('gapReadout'),
        bar1: document.getElementById('bar1'),
        bar2: document.getElementById('bar2'),
        addBar: document.getElementById('addBarBtn'),
        removeBar: document.getElementById('removeBarBtn'),
        undoBar: document.getElementById('undoBarBtn'),
        barSuccess: document.getElementById('barSuccessMsg'),
        whyStep: document.getElementById('whyStep'),
        whyInput: document.getElementById('whyInput'),
        whyCheck: document.getElementById('whyCheckBtn'),
        whyFeedback: document.getElementById('whyFeedback'),
        whyPrompt: document.getElementById('whyPrompt'),
        whySkip: document.getElementById('whySkipLink'),
        finalArea: document.getElementById('finalStepsArea'),
        fGroupsLabel: document.getElementById('finalGroupsLabel'),
        fGroupsInput: document.getElementById('finalGroupsInput'),
        fGroupsBtn: document.getElementById('finalGroupsBtn'),
        fGroupsSkip: document.getElementById('finalGroupsSkip'),
        fTotalsStep: document.getElementById('finalTotalsStep'),
        fTotalsLabel: document.getElementById('finalTotalsLabel'),
        eq1Label: document.getElementById('eq1Label'),
        fTotal1Input: document.getElementById('finalTotal1Input'),
        fTotal1Btn: document.getElementById('finalTotal1Btn'),
        fTotal1Skip: document.getElementById('finalTotal1Skip'),
        eq2Label: document.getElementById('eq2Label'),
        fTotal2Input: document.getElementById('finalTotal2Input'),
        fTotal2Btn: document.getElementById('finalTotal2Btn'),
        fTotal2Skip: document.getElementById('finalTotal2Skip'),
        finalCelebrate: document.getElementById('finalCelebrate'),
        tableControls: document.getElementById('tableControls')
    };

    function init() {
        loadProblem(PROBLEMS[0]);
        el.submitBtn.onclick = () => addRow(parseInt(el.groupInput.value));
        el.addBtn.onclick = () => {
            const max = state.rows.length ? Math.max(...state.rows.map(r => r.n)) : 0;
            addRow(max + 1);
        };
        el.demoToggle.onchange = (e) => { state.demoMode = e.target.checked; save(); renderAll(); };
        el.scaffoldBtn.onclick = toggleScaffold;
        el.resetBtn.onclick = resetProblem;
        el.addBar.onclick = () => moveBars(1);
        el.removeBar.onclick = () => moveBars(-1);
        el.undoBar.onclick = undoMove;
        el.whyCheck.onclick = checkWhy;
        el.whySkip.onclick = () => { completeWhy(currentProblem.whyAnswer); };

        el.fGroupsBtn.onclick = () => checkFinalStep('groups', el.fGroupsInput, currentProblem.answerGroups);
        el.fGroupsSkip.onclick = () => checkFinalStep('groups', el.fGroupsInput, currentProblem.answerGroups, true);
        el.fTotal1Btn.onclick = () => checkFinalStep('total1', el.fTotal1Input, currentProblem.answerTotal);
        el.fTotal1Skip.onclick = () => checkFinalStep('total1', el.fTotal1Input, currentProblem.answerTotal, true);
        el.fTotal2Btn.onclick = () => checkFinalStep('total2', el.fTotal2Input, currentProblem.answerTotal);
        el.fTotal2Skip.onclick = () => checkFinalStep('total2', el.fTotal2Input, currentProblem.answerTotal, true);
    }

    function loadProblem(p) {
        currentProblem = p;
        const saved = localStorage.getItem(p.storageKey);
        state = saved ? JSON.parse(saved) : getDefaultState();
        el.demoToggle.checked = state.demoMode;
        renderAll();
    }

    function getDefaultState() {
        return { 
            rows: [{ n: 1, v1: null, v2: null, vDiff: null }], 
            scaffoldActive: false, barOffset: 0, barDone: false, 
            diffInputs: {}, attempts: {}, whyDone: false, demoMode: false,
            finalGroupsDone: false, finalTotal1Done: false, finalTotal2Done: false
        };
    }

    function save() { localStorage.setItem(currentProblem.storageKey, JSON.stringify(state)); }

    function renderTabs() {
        el.tabs.innerHTML = "";
        PROBLEMS.forEach(p => {
            const b = document.createElement('button');
            b.className = "tab-btn" + (p === currentProblem ? " active" : "");
            b.innerText = p.tabLabel;
            b.onclick = () => loadProblem(p);
            el.tabs.appendChild(b);
        });
    }

    function renderAll() {
        renderTabs();
        el.question.innerHTML = currentProblem.questionText;
        el.groupNounLabel.innerText = `Number of ${currentProblem.groupNoun}`;
        el.addBtn.innerText = `+ Add +1 ${currentProblem.groupNounSingular}`;
        
        const solved = checkSolvedLogic();
        el.tableControls.classList.toggle('hidden', solved && !state.demoMode);

        const highColorClass = currentProblem.highType === 'extra' ? 'header-extra' : 'header-short';
        el.tableHead.innerHTML = `
            <tr>
                <th rowspan="2" class="col-noun">Number of<br>${currentProblem.groupNoun}</th>
                <th colspan="2" class="merged-header">Total Number of ${currentProblem.itemName.charAt(0).toUpperCase() + currentProblem.itemName.slice(1)}</th>
                ${state.scaffoldActive ? '<th rowspan="2" class="col-diff">Difference</th>' : ''}
            </tr>
            <tr>
                <th class="header-extra">${currentProblem.lowRate} each <span class="header-subtext">+${currentProblem.lowLeftover} extra</span></th>
                <th class="${highColorClass}">${currentProblem.highRate} each <span class="header-subtext">${currentProblem.highType === 'extra' ? '+' : '-'}${currentProblem.highRemainder} ${currentProblem.highType}</span></th>
            </tr>
        `;

        el.colDiffStyle.classList.toggle('hidden', !state.scaffoldActive);
        const max = state.rows.length ? Math.max(...state.rows.map(r => r.n)) : 1;
        el.groupInput.value = max;

        renderTable();
        updateScaffoldVisibility();
        renderScaffold();
        renderFinalSteps();
    }

    function addRow(n) {
        if (isNaN(n) || n < 1) return;
        if (state.rows.some(r => r.n === n)) return;
        state.rows.push({ n, v1: null, v2: null, vDiff: null });
        el.groupInput.value = n;
        save(); renderTable();
    }

    function renderTable() {
        el.tableBody.innerHTML = "";
        const sortedRows = state.scaffoldActive ? [...state.rows].sort((a,b) => a.n - b.n) : state.rows;
        sortedRows.forEach(row => {
            const tr = document.createElement('tr');
            const target1 = row.n * currentProblem.lowRate + currentProblem.lowLeftover;
            const target2 = currentProblem.highType === 'extra' 
                ? (row.n * currentProblem.highRate + currentProblem.highRemainder)
                : (row.n * currentProblem.highRate - currentProblem.highRemainder);
            
            if (state.demoMode || (row.v1 === target1 && row.v2 === target2)) {
                if (target1 === target2) tr.className = "solved";
            }

            tr.innerHTML = `<td style="font-weight:700;">${row.n}</td>`;
            tr.appendChild(renderCell(row, 1, target1, `${row.n} × ${currentProblem.lowRate}`, `+ ${currentProblem.lowLeftover}`, 'extra'));
            tr.appendChild(renderCell(row, 2, target2, `${row.n} × ${currentProblem.highRate}`, `${currentProblem.highType === 'extra' ? '+' : '-'} ${currentProblem.highRemainder}`, currentProblem.highType));
            
            if (state.scaffoldActive) {
                const diffTarget = Math.abs(target1 - target2);
                tr.appendChild(renderDiffCell(row, diffTarget));
            }
            el.tableBody.appendChild(tr);
        });
    }

    function renderCell(row, idx, target, baseOp, modOp, type) {
        const td = document.createElement('td');
        const key = `r${row.n}_v${idx}`;
        const currentVal = row[`v${idx}`];
        const isDone = state.demoMode || currentVal === target;
        const modClass = type === 'extra' ? 'op-extra' : 'op-short';

        const wrap = document.createElement('div');
        wrap.className = "cell-op-wrap";
        wrap.innerHTML = `<span class="cell-op">${baseOp} <span class="${modClass}">${modOp}</span> = </span>`;

        if (isDone) {
            const display = document.createElement('div');
            display.className = "cell-input";
            display.style.background = "var(--tick-green-soft)";
            display.style.borderColor = "var(--tick-green)";
            display.innerText = target;
            wrap.appendChild(display);
        } else {
            const input = document.createElement('input');
            input.className = "cell-input"; input.type = "number"; input.inputmode = "numeric"; input.value = currentVal || "";
            const btn = document.createElement('button');
            btn.className = "btn btn-primary btn-check"; btn.innerText = "Check";
            const skip = document.createElement('span');
            skip.className = "skip-link" + (state.demoMode ? "" : " hidden"); skip.innerText = "Skip";
            btn.onclick = () => { handleInput(key, parseInt(input.value), target, () => { row[`v${idx}`] = target; save(); renderTable(); processProgression(row); }, baseOp + modOp); };
            skip.onclick = () => { row[`v${idx}`] = target; save(); renderTable(); processProgression(row); };
            wrap.appendChild(input); wrap.appendChild(btn); wrap.appendChild(skip);
        }
        td.appendChild(wrap);
        return td;
    }

    function renderDiffCell(row, target) {
        const td = document.createElement('td');
        const key = `r${row.n}_diff`;
        const isDone = state.demoMode || state.diffInputs[row.n] === target;
        if (!state.barDone) {
            td.innerHTML = `<span style="color:var(--ink-soft); font-style:italic; font-size:24px;">...</span>`;
        } else if (isDone) {
            td.innerHTML = `<div class="cell-input" style="background:var(--amber-light); border-color:var(--amber); width:100%; margin:0 auto;">${target}</div>`;
        } else {
            const wrap = document.createElement('div'); wrap.className = "cell-op-wrap";
            const input = document.createElement('input'); input.className = "cell-input";
            input.type = "number"; input.inputmode = "numeric"; input.style.width = "90px";
            const btn = document.createElement('button'); btn.className = "btn btn-primary btn-check"; btn.innerText = "✓";
            const skip = document.createElement('span'); skip.className = "skip-link" + (state.demoMode ? "" : " hidden"); skip.innerText = "Skip";
            btn.onclick = () => { handleInput(key, parseInt(input.value), target, () => { state.diffInputs[row.n] = target; save(); renderTable(); checkAllDiffs(); }, "Difference"); };
            skip.onclick = () => { state.diffInputs[row.n] = target; save(); renderTable(); checkAllDiffs(); };
            wrap.appendChild(input); wrap.appendChild(btn); wrap.appendChild(skip);
            td.appendChild(wrap);
        }
        return td;
    }

    function handleInput(id, val, target, onSuccess, hintLabel) {
        state.attempts[id] = (state.attempts[id] || 0) + 1;
        if (val === target) onSuccess();
        else {
            const msg = state.attempts[id] < 3 ? `Check your calculation for "${hintLabel}".` : `The answer is ${target}.`;
            showFeedback(msg, id);
        }
    }

    function processProgression(row) {
        const t1 = row.n * currentProblem.lowRate + currentProblem.lowLeftover;
        const t2 = currentProblem.highType === 'extra' ? (row.n * currentProblem.highRate + currentProblem.highRemainder) : (row.n * currentProblem.highRate - currentProblem.highRemainder);
        if ((state.demoMode || (row.v1 === t1 && row.v2 === t2))) {
            if (t1 === t2) renderAll();
            else if (!state.demoMode) {
                const lastRow = state.rows[state.rows.length - 1];
                if (row.n === lastRow.n) { addRow(row.n + 1); renderAll(); }
            }
        }
    }

    function checkSolvedLogic() {
        return state.rows.some(r => {
            const t1 = r.n * currentProblem.lowRate + currentProblem.lowLeftover;
            const t2 = currentProblem.highType === 'extra' ? (r.n * currentProblem.highRate + currentProblem.highRemainder) : (r.n * currentProblem.highRate - currentProblem.highRemainder);
            return (state.demoMode || (r.v1 === t1 && r.v2 === t2)) && (t1 === t2);
        });
    }

    function updateScaffoldVisibility() {
        const solved = checkSolvedLogic();
        el.scaffoldBtn.classList.toggle('hidden', !(state.demoMode || solved));
        el.scaffoldBtn.classList.toggle('active', state.scaffoldActive);
    }

    function toggleScaffold() {
        state.scaffoldActive = !state.scaffoldActive;
        if (state.scaffoldActive) {
            for (let i = 1; i <= currentProblem.answerGroups; i++) if (!state.rows.some(r => r.n === i)) addRow(i);
        }
        save(); renderAll();
    }

    function renderScaffold() {
        el.scaffoldArea.classList.toggle('hidden', !state.scaffoldActive);
        if (!state.scaffoldActive) return;
        const b1Base = currentProblem.lowLeftover, b2Base = currentProblem.highType === 'extra' ? currentProblem.highRemainder : -currentProblem.highRemainder;
        const cur1 = b1Base + state.barOffset, cur2 = b2Base + state.barOffset;
        updateBar(el.bar1, cur1, 5, document.getElementById('bar1LabelTop'), document.getElementById('bar1LabelBot'));
        updateBar(el.bar2, cur2, 5, document.getElementById('bar2LabelTop'), document.getElementById('bar2LabelBot'));
        el.gapReadout.innerText = `Gap: ${Math.abs(cur1 - cur2)}`;
        if (cur2 === 0 && !state.barDone) {
            state.barDone = true; el.barSuccess.innerHTML = `The ${currentProblem.highRate} each bar is now at zero. The other bar shows the Big Difference: ${currentProblem.bigDifference}.`;
            el.barSuccess.classList.remove('hidden'); el.addBar.disabled = el.removeBar.disabled = el.undoBar.disabled = true;
            setTimeout(() => { renderTable(); showWhyStep(); }, 1000); save();
        } else if (state.barDone) {
            el.barSuccess.classList.remove('hidden'); el.addBar.disabled = el.removeBar.disabled = el.undoBar.disabled = true;
            showWhyStep();
        }
    }

    function renderFinalSteps() {
        const isSolved = checkSolvedLogic();
        if (!isSolved || state.scaffoldActive) { el.finalArea.classList.add('hidden'); return; }
        el.finalArea.classList.remove('hidden');
        el.fGroupsLabel.innerText = `How many ${currentProblem.groupNoun} does ${currentProblem.personName} have?`;
        el.fTotalsLabel.innerText = `How many ${currentProblem.itemName} does ${currentProblem.personName} have?`;
        const n = currentProblem.answerGroups;
        el.eq1Label.innerHTML = `<span class="op-extra">${currentProblem.lowRate} each:</span> ${n} × ${currentProblem.lowRate} + ${currentProblem.lowLeftover} =`;
        const highOp = currentProblem.highType === 'extra' ? '+' : '-';
        const highColor = currentProblem.highType === 'extra' ? 'op-extra' : 'op-short';
        el.eq2Label.innerHTML = `<span class="${highColor}">${currentProblem.highRate} each:</span> ${n} × ${currentProblem.highRate} ${highOp} ${currentProblem.highRemainder} =`;
        el.fGroupsSkip.classList.toggle('hidden', !state.demoMode);
        el.fTotal1Skip.classList.toggle('hidden', !state.demoMode);
        el.fTotal2Skip.classList.toggle('hidden', !state.demoMode);

        if (state.finalGroupsDone) {
            el.fGroupsInput.value = currentProblem.answerGroups; el.fGroupsInput.disabled = true;
            el.fGroupsBtn.classList.add('hidden'); el.fGroupsSkip.classList.add('hidden');
            el.fTotalsStep.classList.remove('hidden');
        } else {
            el.fGroupsInput.disabled = false; el.fGroupsBtn.classList.remove('hidden'); el.fTotalsStep.classList.add('hidden');
        }
        if (state.finalTotal1Done) { el.fTotal1Input.value = currentProblem.answerTotal; el.fTotal1Input.disabled = true; el.fTotal1Btn.classList.add('hidden'); el.fTotal1Skip.classList.add('hidden'); }
        else { el.fTotal1Input.disabled = false; el.fTotal1Btn.classList.remove('hidden'); }
        if (state.finalTotal2Done) { el.fTotal2Input.value = currentProblem.answerTotal; el.fTotal2Input.disabled = true; el.fTotal2Btn.classList.add('hidden'); el.fTotal2Skip.classList.add('hidden'); }
        else { el.fTotal2Input.disabled = false; el.fTotal2Btn.classList.remove('hidden'); }

        if (state.finalTotal1Done && state.finalTotal2Done) {
            el.finalCelebrate.innerHTML = `<h2 class="brand" style="font-size:40px;">Correct!</h2><p style="font-size:32px; font-weight:700; font-family:var(--font-mono);">${currentProblem.personName} has ${currentProblem.answerTotal} ${currentProblem.itemName}.</p><p style="font-size:20px; color:var(--ink-soft);">Press 'Reset Problem' if you want to try again.</p>`;
            el.finalCelebrate.classList.remove('hidden');
        } else { el.finalCelebrate.classList.add('hidden'); }
    }

    function checkFinalStep(key, inputEl, target, isSkip = false) {
        const id = `final_${key}`;
        const val = parseInt(inputEl.value);
        if (isSkip || val === target) {
            if (key === 'groups') state.finalGroupsDone = true;
            if (key === 'total1') state.finalTotal1Done = true;
            if (key === 'total2') state.finalTotal2Done = true;
            save(); renderFinalSteps();
        } else {
            state.attempts[id] = (state.attempts[id] || 0) + 1;
            const msg = state.attempts[id] < 3 ? "Not quite. Look closely at the solved row in the table." : `The answer is ${target}.`;
            showFeedback(msg, id, inputEl);
        }
    }

    function showFeedback(msg, id, targetInput = null) {
        const existing = document.getElementById('fb_' + id); if (existing) existing.remove();
        const div = document.createElement('div'); div.id = 'fb_' + id; div.className = "feedback-panel bad";
        div.innerHTML = `<span>${msg}</span><button class="btn btn-ghost btn-check">Retry</button>`;
        div.querySelector('button').onclick = () => { div.remove(); if (targetInput) { targetInput.value = ""; targetInput.focus(); } };
        document.body.appendChild(div);
        const rect = (targetInput || document.activeElement).getBoundingClientRect();
        div.style.position = 'fixed'; div.style.top = (rect.bottom + window.scrollY + 10) + 'px';
        div.style.left = Math.max(10, rect.left - 50) + 'px'; div.style.zIndex = 1000; div.style.boxShadow = "0 10px 25px rgba(0,0,0,0.2)";
    }

    function updateBar(barEl, val, scale, labelTop, labelBot) {
        const h = Math.abs(val) * scale; barEl.style.height = h + 'px';
        barEl.className = `bar ${val >= 0 ? 'up green' : 'down red'}`;
        const label = `${Math.abs(val)} ${val >= 0 ? 'extra' : 'short'}`;
        if (val >= 0) { labelTop.innerText = label; labelBot.innerText = ""; barEl.style.bottom = '0'; }
        else { labelBot.innerText = label; labelTop.innerText = ""; barEl.style.bottom = -h + 'px'; }
    }

    function moveBars(dir) { state.barOffset += dir; save(); renderScaffold(); }
    function undoMove() { state.barOffset = 0; save(); renderScaffold(); }
    function showWhyStep() {
        el.whyStep.classList.remove('hidden'); el.whyPrompt.innerText = `The gap closes by ${currentProblem.smallDifference} every time we add one more ${currentProblem.groupNounSingular.toLowerCase()}. Why ${currentProblem.smallDifference}?`;
        el.whySkip.classList.toggle('hidden', !state.demoMode);
        if (state.whyDone) completeWhy(currentProblem.whyAnswer);
    }

    function checkWhy() {
        const raw = el.whyInput.value.toLowerCase().replace(/\s+/g, '').replace(/[–—]/g, '-').replace(/÷/g, '/');
        const cleanTarget = currentProblem.whyAnswer.toLowerCase().replace(/\s+/g, '').replace(/[–—]/g, '-');
        if (raw === cleanTarget || raw.startsWith(cleanTarget + "=")) completeWhy(el.whyInput.value);
        else if (!isNaN(parseInt(raw)) && raw.length < 3) showFeedbackWhy("Show us how you got it. Which two numbers did you compare?");
        else {
            state.attempts['why'] = (state.attempts['why'] || 0) + 1;
            if (state.attempts['why'] >= 3) completeWhy(currentProblem.whyAnswer);
            else showFeedbackWhy("Not quite. Compare the two rates.");
        }
    }

    function showFeedbackWhy(msg) { el.whyFeedback.innerText = msg; el.whyFeedback.className = "feedback-panel bad"; el.whyFeedback.classList.remove('hidden'); }
    function completeWhy(val) { state.whyDone = true; el.whyInput.value = val; el.whyInput.disabled = true; el.whyCheck.classList.add('hidden'); el.whySkip.classList.add('hidden'); el.whyFeedback.classList.add('hidden'); save(); renderFinalSteps(); }
    function checkAllDiffs() { const allDone = state.rows.every(r => state.diffInputs[r.n] === Math.abs((r.n * currentProblem.lowRate + currentProblem.lowLeftover) - (currentProblem.highType === 'extra' ? (r.n * currentProblem.highRate + currentProblem.highRemainder) : (r.n * currentProblem.highRate - currentProblem.highRemainder)))); if (allDone) renderScaffold(); }

    function resetProblem() {
        if (confirm("Reset everything for this problem? This will also return to Student Mode.")) { 
            localStorage.removeItem(currentProblem.storageKey); 
            state = getDefaultState();
            el.demoToggle.checked = false;
            el.fGroupsInput.value = ""; el.fTotal1Input.value = ""; el.fTotal2Input.value = "";
            save(); renderAll();
            document.querySelectorAll('.feedback-panel').forEach(p => p.remove());
        }
    }

    init();
})();
</script>
</body>
</html>
